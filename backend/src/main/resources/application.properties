# =============================================================================
# LabDistrib — Application Configuration
# =============================================================================
# This file configures how the Spring Boot application behaves.
# Think of it as the "settings panel" for your application.
# =============================================================================

# -----------------------------------------------------------------------------
# Application Name
# -----------------------------------------------------------------------------
spring.application.name=labdistrib

# -----------------------------------------------------------------------------
# Server Configuration
# -----------------------------------------------------------------------------
server.port=8080

# -----------------------------------------------------------------------------
# Database Connection (Stage 4)
# -----------------------------------------------------------------------------
# JDBC URL: tells Java how to connect to MySQL
#   jdbc:mysql://  → protocol (like http://)
#   localhost:3306  → MySQL server address and port
#   /labdistrib    → database name
#   ?parameters    → connection options
spring.datasource.url=jdbc:mysql://localhost:3306/labdistrib?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Username and password are in application-local.properties (NOT committed to Git)
# Spring Boot automatically merges both files

# -----------------------------------------------------------------------------
# JPA / Hibernate Configuration (Stage 4)
# -----------------------------------------------------------------------------
# ddl-auto=update → Hibernate automatically creates/updates tables based on
# your @Entity classes. Options:
#   none    → Do nothing (production)
#   update  → Create tables if missing, add new columns (development)
#   create  → Drop and recreate tables on every startup (dangerous!)
#   validate → Just check that tables match entities (production)
spring.jpa.hibernate.ddl-auto=update

# show-sql=true → Print every SQL query Hibernate runs to the console
# Very useful for learning and debugging!
spring.jpa.show-sql=true

# format_sql=true → Make the SQL output readable (indented, multi-line)
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate we're using MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Prevent "open-in-view" warning
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.com.labdistrib=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%level] %logger{36} - %msg%n

# -----------------------------------------------------------------------------
# Active Profiles
# -----------------------------------------------------------------------------
# Load application-local.properties in addition to this file
# This is where your MySQL username/password live (not committed to Git)
spring.profiles.active=local
